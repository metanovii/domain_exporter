groups:
- name: domain
  rules:
  # domain_expiry_days is -1 when the check failed, so every expiry rule is
  # filtered with domain_probe_success == 1. Failed checks have their own rule.
  - alert: DomainExpiringLessThen30Days
    expr: >
      domain_expiry_days < 30 > 5
      and on(domain) domain_probe_success == 1
    for: 1h
    labels:
      severity: warning
    annotations:
      description: 'Domain {{ $labels.domain }} will expire in less than 30 days'
      summary: '{{ $labels.domain }}: domain is expiring'

  - alert: DomainExpiringLessThen5Days
    expr: >
      domain_expiry_days <= 5
      and on(domain) domain_probe_success == 1
    for: 1h
    labels:
      severity: page
    annotations:
      description: 'Domain {{ $labels.domain }} will expire in less than 5 days'
      summary: '{{ $labels.domain }}: domain is expiring'

  - alert: DomainProbeFailure
    expr: domain_probe_success == 0
    for: 1h
    labels:
      severity: warning
    annotations:
      description: 'Domain {{ $labels.domain }} is not valid. Cannot probe'
      summary: '{{ $labels.domain }}: cannot probe'

  - alert: DomainExporterDown
    expr: up{job="domain"} == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      description: 'domain_exporter on {{ $labels.instance }} is down'
      summary: '{{ $labels.instance }}: domain_exporter is down'
